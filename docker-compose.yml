services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: perfume_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      - db

volumes:
  postgres_data:
