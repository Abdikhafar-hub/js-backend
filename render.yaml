databases:
  - name: js-system-postgres
    databaseName: perfume_erp
    user: perfume_erp
    plan: free
    region: frankfurt
    ipAllowList: []

services:
  # Sync this Blueprint only. It owns the database and all three services,
  # although each service deploys from its own GitHub repository.
  - type: web
    name: js-backend
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/Abdikhafar-hub/js-backend
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    initialDeployHook: NODE_ENV=development npm run prisma:seed && ALLOW_STOREFRONT_CATALOG_SEED=true npm run seed:storefront-catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: js-system-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        value: redis://placeholder:6379
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: js-system
      - key: CLOUDINARY_SECURE
        value: "true"
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: APP_BASE_URL
        value: https://js-landing.onrender.com
      - key: API_BASE_URL
        value: https://js-backend.onrender.com/api/v1
      - key: CORS_ALLOWED_ORIGINS
        value: https://js-frontend.onrender.com,https://js-landing.onrender.com
      - key: MPESA_CALLBACK_URL
        value: https://js-backend.onrender.com/api/v1/payments/mpesa/callback

  - type: web
    name: js-frontend
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/Abdikhafar-hub/js-frontend
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://js-backend.onrender.com/api/v1

  - type: web
    name: js-landing
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/Abdikhafar-hub/jsperfumes
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://js-backend.onrender.com/api/v1/storefront
      - key: VITE_ORGANIZATION_ID
        value: org_pulse_perfumes
